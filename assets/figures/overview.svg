<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600pt" height="582pt" viewBox="0 0 600 582">
<title>Enterprise agents as organizational deployments</title>
<desc>The original user-supplied illustration is embedded unchanged. Editable annotations connect capability, access to private organizational resources, coordination, organizational principals, authority, delegation, accountability and real effects. The lower organizational setting is context, not a fifth surveyed layer. Two clipping windows introduce annotation space between the original rows; the artwork is not redrawn.</desc>
<defs>
<image id="original-art" width="600" height="400.0" xlink:href="overview-art.png"/>
</defs>
<rect width="600" height="582" fill="white"/>
<defs><clipPath id="clip-upper"><rect x="0" y="54" width="600" height="191.40625"/></clipPath></defs>
<g clip-path="url(#clip-upper)"><use xlink:href="#original-art" x="0" y="54.0"/></g>
<defs><clipPath id="clip-lower"><rect x="0" y="289" width="600" height="208.59375"/></clipPath></defs>
<g clip-path="url(#clip-lower)"><use xlink:href="#original-art" x="0" y="97.59375"/></g>
<text x="8" y="16" font-family="Arial" font-size="12" font-weight="bold" fill="#3F6F92" text-anchor="start">I  Capabilities</text>
<text x="8" y="30" font-family="Arial" font-size="9" font-weight="normal" fill="#4C555D" text-anchor="start">Interpret partly specified goals</text>
<text x="8" y="42" font-family="Arial" font-size="9" font-weight="normal" fill="#4C555D" text-anchor="start">Plan, remember and act</text>
<polyline points="123,47 123,71 107,120" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="123,47 123,71 107,120" fill="none" stroke="#3F6F92" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="107" cy="120" r="1.6" fill="#3F6F92" stroke="white" stroke-width=".5"/>
<text x="211" y="16" font-family="Arial" font-size="12" font-weight="bold" fill="#4B765C" text-anchor="start">II  Integration</text>
<text x="211" y="30" font-family="Arial" font-size="9" font-weight="normal" fill="#4C555D" text-anchor="start">Access private knowledge,</text>
<text x="211" y="42" font-family="Arial" font-size="9" font-weight="normal" fill="#4C555D" text-anchor="start">tools and organizational records</text>
<polyline points="349,47 349,76 350,132" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="349,47 349,76 350,132" fill="none" stroke="#4B765C" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="350" cy="132" r="1.6" fill="#4B765C" stroke="white" stroke-width=".5"/>
<text x="411" y="16" font-family="Arial" font-size="12" font-weight="bold" fill="#746285" text-anchor="start">III  Coordination</text>
<text x="411" y="30" font-family="Arial" font-size="9" font-weight="normal" fill="#4C555D" text-anchor="start">Share state and coordinate work</text>
<text x="411" y="42" font-family="Arial" font-size="9" font-weight="normal" fill="#4C555D" text-anchor="start">Handoffs, verification and escalation</text>
<polyline points="535,47 535,78 494,132" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="535,47 535,78 494,132" fill="none" stroke="#746285" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="494" cy="132" r="1.6" fill="#746285" stroke="white" stroke-width=".5"/>
<text x="8" y="265" font-family="Arial" font-size="12" font-weight="bold" fill="#9B762E" text-anchor="start">IV  Governance</text>
<text x="8" y="279" font-family="Arial" font-size="9" font-weight="normal" fill="#4C555D" text-anchor="start">Decision rights, named owners, audit and recovery</text>
<polyline points="244,283 244,299 273,340" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="244,283 244,299 273,340" fill="none" stroke="#9B762E" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="273" cy="340" r="1.6" fill="#9B762E" stroke="white" stroke-width=".5"/>
<text x="320" y="265" font-family="Arial" font-size="12" font-weight="bold" fill="#9A6068" text-anchor="start">Organizational context</text>
<text x="320" y="279" font-family="Arial" font-size="9" font-weight="normal" fill="#4C555D" text-anchor="start">Work, responsibilities and real consequences</text>
<text x="5" y="464" font-family="Arial" font-size="9.2" font-weight="bold" fill="#9B762E" text-anchor="start">Organizational principal</text>
<text x="5" y="476" font-family="Arial" font-size="8.5" font-weight="normal" fill="#4C555D" text-anchor="start">Grants rights and</text>
<text x="5" y="487" font-family="Arial" font-size="8.5" font-weight="normal" fill="#4C555D" text-anchor="start">assigns work</text>
<polyline points="15,451 15,409 61,372" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="15,451 15,409 61,372" fill="none" stroke="#9B762E" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="61" cy="372" r="1.6" fill="#9B762E" stroke="white" stroke-width=".5"/>
<text x="8" y="518" font-family="Arial" font-size="11" font-weight="bold" fill="#9B762E" text-anchor="start">Authority Λ</text>
<text x="8" y="532" font-family="Arial" font-size="9" font-weight="normal" fill="#4C555D" text-anchor="start">Permitted actions and limits</text>
<text x="8" y="544" font-family="Arial" font-size="9" font-weight="normal" fill="#4C555D" text-anchor="start">Approval rules by action</text>
<polyline points="121,505 121,454 96,430 67,391" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="121,505 121,454 96,430 67,391" fill="none" stroke="#9B762E" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="67" cy="391" r="1.6" fill="#9B762E" stroke="white" stroke-width=".5"/>
<text x="209" y="518" font-family="Arial" font-size="11" font-weight="bold" fill="#746285" text-anchor="start">Delegation Δ</text>
<text x="209" y="532" font-family="Arial" font-size="9" font-weight="normal" fill="#4C555D" text-anchor="start">How much work, for how long,</text>
<text x="209" y="544" font-family="Arial" font-size="9" font-weight="normal" fill="#4C555D" text-anchor="start">and whose work</text>
<polyline points="268,505 268,479 218,449 167,398" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="268,505 268,479 218,449 167,398" fill="none" stroke="#746285" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="167" cy="398" r="1.6" fill="#746285" stroke="white" stroke-width=".5"/>
<text x="409" y="518" font-family="Arial" font-size="11" font-weight="bold" fill="#9A6068" text-anchor="start">Consequences</text>
<text x="409" y="532" font-family="Arial" font-size="9" font-weight="normal" fill="#4C555D" text-anchor="start">Changes to records, commitments</text>
<text x="409" y="544" font-family="Arial" font-size="9" font-weight="normal" fill="#4C555D" text-anchor="start">and effects on outside parties</text>
<polyline points="570,505 583,475 555,445 532,421" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="570,505 583,475 555,445 532,421" fill="none" stroke="#9A6068" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="532" cy="421" r="1.6" fill="#9A6068" stroke="white" stroke-width=".5"/>
<line x1="8" y1="555" x2="592" y2="555" stroke="#D9DDE0" stroke-width=".6"/>
<text x="300" y="572" font-family="Arial" font-size="10.2" font-weight="bold" fill="#26313B" text-anchor="middle">Unit of analysis: the deployment - configured software, rights and accountable people</text>
</svg>
